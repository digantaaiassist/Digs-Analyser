<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Options Seller Position Analyzer</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <style>
    :root { --bg: #0b0f19; --panel: #131b2e; --border: #1e293b; --text: #f8fafc; --muted: #94a3b8; --accent: #38bdf8; --red: #ef4444; --green: #22c55e; --amber: #f59e0b; }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); padding: 16px; line-height: 1.6; }
    .container { max-width: 1000px; margin: 0 auto; }
    header { border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 20px; }
    h1 { font-size: 1.4rem; color: #fff; }
    p.subtitle { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .section-title { font-size: 1.1rem; padding: 10px; border-radius: 6px; margin-bottom: 12px; font-weight: 700; text-align: center; }
    .ce-title { background: rgba(239, 68, 68, 0.1); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.3); }
    .pe-title { background: rgba(34, 197, 94, 0.1); color: var(--green); border: 1px solid rgba(34, 197, 94, 0.3); }
    .strike-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .strike-card h3 { font-size: 0.95rem; margin-bottom: 12px; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
    .strike-input { width: 120px; padding: 4px 8px; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 4px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 8px; }
    label { font-size: 0.75rem; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    select { width: 100%; padding: 8px; background: #000; color: #fff; border: 1px solid var(--border); border-radius: 4px; font-size: 0.85rem; }
    button { width: 100%; padding: 14px; background: var(--accent); color: #000; border: none; border-radius: 6px; font-weight: 800; font-size: 1rem; cursor: pointer; margin-top: 10px; text-transform: uppercase; }
    button:hover { opacity: 0.9; }
    .report { margin-top: 24px; display: none; }
    .report-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
    .report-card h2 { font-size: 1.1rem; color: var(--accent); margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .highlight { color: var(--accent); font-weight: bold; }
    .alert { padding: 12px; border-radius: 6px; font-size: 0.9rem; margin-bottom: 12px; border-left: 4px solid; }
    .alert-bear { background: rgba(239, 68, 68, 0.1); border-color: var(--red); }
    .alert-bull { background: rgba(34, 197, 94, 0.1); border-color: var(--green); }
    .alert-neutral { background: rgba(245, 158, 11, 0.1); border-color: var(--amber); }
    ul { margin-left: 20px; margin-top: 8px; font-size: 0.9rem; color: #cbd5e1; }
    li { margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Advanced Options Seller Analyzer</h1>
      <p class="subtitle">Multi-Strike Analysis (3 CE & 3 PE) based on Institutional Footprints</p>
    </header>

    <div class="grid">
      <!-- Call (CE) Side -->
      <div class="side-col">
        <div class="section-title ce-title">CALL (CE) SIDE - RESISTANCE</div>
        <div id="ce_strikes_container"></div>
      </div>

      <!-- Put (PE) Side -->
      <div class="side-col">
        <div class="section-title pe-title">PUT (PE) SIDE - SUPPORT</div>
        <div id="pe_strikes_container"></div>
      </div>
    </div>

    <button onclick="analyzeMarket()">Generate Market Narrative</button>

    <div id="report_container" class="report">
      <div class="report-card">
        <h2>1. Strike-by-Strike Diagnostics</h2>
        <div id="diagnostic_text" style="font-size: 0.9rem; color: #cbd5e1; white-space: pre-line;"></div>
      </div>

      <div class="report-card">
        <h2>2. Where is the Smart Money (Seller) Sitting?</h2>
        <div id="seller_verdict"></div>
      </div>

      <div class="report-card">
        <h2>3. Course of Action & Execution Plan</h2>
        <div id="action_plan"></div>
      </div>
    </div>
  </div>

  <script>
    // Generate UI for 3 strikes per side
    function createStrikeHTML(side, index) {
      const isCE = side === 'CE';
      const defaultStrike = isCE ? 45000 + (index * 100) : 45000 - (index * 100);
      return `
        <div class="strike-card" id="${side}_strike_${index}">
          <h3>Strike ${index + 1} <input type="number" class="strike-input" id="${side}_val_${index}" value="${defaultStrike}"></h3>
          <div class="field-row">
            <div>
              <label>Price (LTP)</label>
              <select id="${side}_price_${index}">
                <option value="up">Rising</option>
                <option value="down">Falling</option>
              </select>
            </div>
            <div>
              <label>Open Interest (OI)</label>
              <select id="${side}_oi_${index}">
                <option value="up">Increasing</option>
                <option value="down">Decreasing</option>
              </select>
            </div>
            <div>
              <label>Implied Vol. (IV)</label>
              <select id="${side}_iv_${index}">
                <option value="up">Rising</option>
                <option value="down">Falling</option>
              </select>
            </div>
          </div>
        </div>
      `;
    }

    document.getElementById('ce_strikes_container').innerHTML = [0, 1, 2].map(i => createStrikeHTML('CE', i)).join('');
    document.getElementById('pe_strikes_container').innerHTML = [0, 1, 2].map(i => createStrikeHTML('PE', i)).join('');

    function getQuadrant(price, oi) {
      if (price === 'up' && oi === 'up') return 'Long Buildup';
      if (price === 'down' && oi === 'up') return 'Short Buildup';
      if (price === 'up' && oi === 'down') return 'Short Covering';
      if (price === 'down' && oi === 'down') return 'Long Unwinding';
    }

    function analyzeMarket() {
      const data = { CE: [], PE: [] };
      let ceShortBuildupCount = 0;
      let peShortBuildupCount = 0;
      let ceLongUnwindingCount = 0;
      let peLongUnwindingCount = 0;

      // Collect Data
      ['CE', 'PE'].forEach(side => {
        for (let i = 0; i < 3; i++) {
          const strike = document.getElementById(`${side}_val_${i}`).value;
          const price = document.getElementById(`${side}_price_${i}`).value;
          const oi = document.getElementById(`${side}_oi_${i}`).value;
          const iv = document.getElementById(`${side}_iv_${i}`).value;
          const quad = getQuadrant(price, oi);
          
          data[side].push({ strike, price, oi, iv, quad });

          if (side === 'CE' && quad === 'Short Buildup') ceShortBuildupCount++;
          if (side === 'PE' && quad === 'Short Buildup') peShortBuildupCount++;
          if (side === 'CE' && quad === 'Long Unwinding') ceLongUnwindingCount++;
          if (side === 'PE' && quad === 'Long Unwinding') peLongUnwindingCount++;
        }
      });

      // 1. Diagnostics Text
      let diagText = "**CALL (CE) SIDE ANALYSIS:**\n";
      data.CE.forEach(s => {
        diagText += `Strike ${s.strike}: Price ${s.price}, OI ${s.oi} -> **${s.quad}**. IV is ${s.iv}.\n`;
      });
      diagText += "\n**PUT (PE) SIDE ANALYSIS:**\n";
      data.PE.forEach(s => {
        diagText += `Strike ${s.strike}: Price ${s.price}, OI ${s.oi} -> **${s.quad}**. IV is ${s.iv}.\n`;
      });

      document.getElementById('diagnostic_text').innerHTML = diagText.replace(/\*\*(.*?)\*\*/g, '<span class="highlight">$1</span>');

      // 2. Seller Verdict Logic
      let verdictHTML = "";
      let marketBias = "neutral";

      if (ceShortBuildupCount > peShortBuildupCount) {
        marketBias = "bearish";
        verdictHTML = `
          <div class="alert alert-bear">
            <strong>Bearish Dominance:</strong> Sellers are heavily concentrated on the CE side, forming a resistance wall.
          </div>
          <p>The presence of Short Buildup across multiple Call strikes indicates sellers are actively writing CE contracts. They strongly believe the price will not reach these levels and aim to pocket the premium as it decays to zero. If PE strikes simultaneously show Long Unwinding, it confirms buyers are exiting their support positions.</p>
        `;
      } else if (peShortBuildupCount > ceShortBuildupCount) {
        marketBias = "bullish";
        verdictHTML = `
          <div class="alert alert-bull">
            <strong>Bullish Dominance:</strong> Sellers are aggressively defending the PE side, forming a strong support base.
          </div>
          <p>The accumulation of Short Buildup on Put strikes shows sellers are writing PE options. They expect the market to stay above these levels or rise further. If CE strikes simultaneously show Short Covering, it means trapped CE sellers are forcefully buying to exit, fueling a ferocious upward rally.</p>
        `;
      } else if (ceShortBuildupCount > 0 && peShortBuildupCount > 0) {
        marketBias = "sideways";
        verdictHTML = `
          <div class="alert alert-neutral">
            <strong>Rangebound / Sideways:</strong> Sellers are actively writing contracts on both sides (Short Strangle setup).
          </div>
          <p>Equal Short Buildup on both CE and PE suggests a seller's day. They are attempting to trap the market within a range to capture time decay (Theta) from both sides.</p>
        `;
      } else {
        verdictHTML = `
          <div class="alert alert-neutral">
            <strong>Indecisive / Unwinding:</strong> No clear fresh seller footprints detected across the selected strikes.
          </div>
          <p>If you observe falling prices alongside crashing IV, this is likely massive long unwinding (profit booking) rather than aggressive fresh shorting. Wait for a clearer institutional setup.</p>
        `;
      }
      document.getElementById('seller_verdict').innerHTML = verdictHTML;

      // 3. Course of Action
      let actionHTML = "<ul>";
      
      if (marketBias === "bearish") {
        actionHTML += `<li><strong>Directional View:</strong> Bearish. Every rise is a selling opportunity. As a buyer, look to enter PE positions on retracements.</li>`;
        actionHTML += `<li><strong>Option Selection:</strong> Avoid buying CE options; if IV is crashing, avoid buying naked options altogether. Select ITM PE strikes (Delta 0.60 to 0.70) if trading directionally.</li>`;
      } else if (marketBias === "bullish") {
        actionHTML += `<li><strong>Directional View:</strong> Bullish. Every dip is a buying opportunity. As a buyer, look to enter CE positions near support zones.</li>`;
        actionHTML += `<li><strong>Option Selection:</strong> If CE strikes show Short Covering and IV is spiking, momentum is strong. Select ITM CE strikes (Delta 0.60 to 0.70).</li>`;
      } else {
        actionHTML += `<li><strong>Directional View:</strong> Market is likely rangebound. Avoid aggressive directional buying as premium erosion will dominate.</li>`;
      }

      actionHTML += `
        <li><strong>Execution Filter (Time):</strong> Avoid trading before 9:45 AM or after 2:30 PM.</li>
        <li><strong>Execution Filter (VWAP):</strong> Only take Longs if price trades above VWAP; only take Shorts if price trades below VWAP.</li>
        <li><strong>Execution Filter (Volume):</strong> Ensure the breakout is accompanied by volume (2 consecutive candles >50k for Bank Nifty or >125k for Nifty).</li>
        <li><strong>Execution Filter (RSI):</strong> Do not initiate fresh Longs if RSI > 80, and do not initiate fresh Shorts if RSI < 20.</li>
        <li><strong>Stop Loss Anchor:</strong> Keep your Stop Loss at the high/low of the first breakout candle. If breached, pack up and exit immediately.</li>
      </ul>`;

      document.getElementById('action_plan').innerHTML = actionHTML;
      document.getElementById('report_container').style.display = 'block';
    }
  </script>
</body>
</html>
